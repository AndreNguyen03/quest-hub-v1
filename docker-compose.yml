# Dev-only (local). Staging/Prod chạy trên k3s qua Kustomize:
# infra/k8s/overlays/{staging,prod}. Env vars đọc từ .env (xem .env.dev.example).
name: ${COMPOSE_PROJECT_NAME:-questhub}

services:
  postgres:
    image: postgres:16-alpine
    container_name: questhub-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-questhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-questhub}
      POSTGRES_DB: ${POSTGRES_DB:-questhub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: questhub-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.8
    container_name: questhub-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data

  # Phase 2 — mở khi tách microservices / RabbitMQ relay
  # rabbitmq:
  #   image: rabbitmq:3.13-management-alpine
  #   container_name: questhub-rabbitmq
  #   ports:
  #     - "5672:5672"
  #     - "15672:15672"

volumes:
  pgdata:
  esdata:
