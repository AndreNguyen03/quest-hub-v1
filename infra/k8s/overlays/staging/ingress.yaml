apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: questhub-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  rules:
    - host: staging.questhub.app
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: questhub-backend
                port:
                  number: 9090
          - path: /ai
            pathType: Prefix
            backend:
              service:
                name: questhub-ai-service
                port:
                  number: 8090