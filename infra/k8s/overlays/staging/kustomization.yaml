apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: questhub-staging
resources:
  - ../../base
  - ingress.yaml
images:
  - name: ghcr.io/questhub/backend
    newTag: staging-latest
  - name: ghcr.io/questhub/ai-service
    newTag: staging-latest
patches:
  - target:
      kind: Deployment
      name: questhub-backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0
        value:
          name: SPRING_PROFILES_ACTIVE
          value: staging