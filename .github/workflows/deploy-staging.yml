name: deploy-staging

# Deploy STAGING — tự động khi merge vào main.
# Build image (tag = git SHA, immutable) → push GHCR → kustomize build
# overlay staging với đúng SHA → kubectl apply lên k3s staging cluster.
# Khớp stage 5 trong docs/devsecops-pipeline.html.

on:
  push:
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/backend
            ghcr.io/${{ github.repository }}/ai-service
          tags: |
            type=sha

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - name: Build & push ai-service
        uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          push: true
          tags: ghcr.io/${{ github.repository }}/ai-service:${{ github.sha }}

      - name: Setup kubeconfig (staging)
        run: |
          echo "${{ secrets.STAGING_KUBECONFIG }}" | base64 -d > kubeconfig.yaml

      - name: Deploy to staging
        run: |
          kubectl --kubeconfig kubeconfig.yaml apply -k infra/k8s/overlays/staging
          kubectl --kubeconfig kubeconfig.yaml rollout status deployment/questhub-backend -n questhub-staging --timeout=300s
          kubectl --kubeconfig kubeconfig.yaml rollout status deployment/questhub-ai-service -n questhub-staging --timeout=300s