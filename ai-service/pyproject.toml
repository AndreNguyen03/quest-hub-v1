[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-service"
version = "1.0.0"
description = "QuestHub AI Service - Quest recommendation, generation, grading, and coaching"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "QuestHub Team", email = "team@questhub.io"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "openai==1.57.2",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "elasticsearch[async]==8.17.0",
    "httpx==0.28.1",
    "pydantic-settings==2.7.0",
    "python-dotenv==1.0.1",
    "structlog==24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.23.7",
    "pytest-mock==3.14.0",
    "httpx==0.28.1",
    "faker==25.3.0",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "pre-commit==3.8.0",
]

eval = [
    "pytest==8.3.3",
    "pytest-asyncio==0.23.7",
    "openai==1.57.2",
    "numpy==1.26.4",
    "scikit-learn==1.5.1",
    "datasets==2.20.0",
    "evaluate==0.4.3",
]

# Chỉ định rõ cho setuptools biết vị trí mã nguồn Python
[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "evals*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "T20", # print statements
]
ignore = [
    "S101", # assert statements in tests
    "T201", # print in tests
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
strict = false

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pre-commit-hooks]
ruff-check = {id = "ruff-check", name = "ruff check", entry = "ruff check", language = "system", types = ["python"]}
ruff-format = {id = "ruff-format", name = "ruff format", entry = "ruff format", language = "system", types = ["python"]}
mypy = {id = "mypy", name = "mypy", entry = "mypy", language = "system", types = ["python"]}
pytest = {id = "pytest", name = "pytest", entry = "pytest", language = "system", types = ["python"], pass_filenames = false}